name: Update Calendar

on:
  workflow_dispatch:
  schedule:
    - cron: '0 */6 * * *'
  push:
    branches: [main]
    paths:
      - update_calendar.py
      - .github/workflows/update_calendar.yml

concurrency:
  group: update-calendar
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: python -m pip install --quiet requests icalendar

      - name: Run tests
        run: python -m unittest -v

      - name: Rebuild calendars
        run: python update_calendar.py

      - name: Commit and push if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A calendars
          if git diff --cached --quiet; then
            echo "No calendar changes."
            exit 0
          fi
          git commit -m "Update calendars [skip ci]"
          git pull --rebase origin main
          git push origin main
